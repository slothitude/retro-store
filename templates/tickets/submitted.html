{% extends "base.html" %}
{% block title %}Ticket Submitted — RetroMonkey{% endblock %}

{% block content %}
<div class="ticket-page">
    <div class="success-icon">&#10003;</div>
    <h1>Ticket Submitted!</h1>
    <p>Your ticket key is: <code class="ticket-key">{{ key }}</code></p>
    <p>Save this key — you'll need it to check your ticket status.</p>
    <div class="success-actions">
        <a href="/tickets/lookup?key={{ key }}" class="btn btn-primary">View Ticket</a>
        <a href="/" class="btn btn-ghost">Back to Store</a>
    </div>
</div>
{% endblock %}
