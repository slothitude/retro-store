{% extends "base.html" %}
{% block title %}Submit a Ticket — RetroZone{% endblock %}

{% block content %}
<div class="ticket-page">
    <h1>Submit a Support Ticket</h1>
    <p>Need help? Fill out the form below and we'll get back to you within 24 hours.</p>

    <form method="POST" class="ticket-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="subject">Subject *</label>
            <input type="text" id="subject" name="subject" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category">
                    <option value="general">General</option>
                    <option value="order">Order Issue</option>
                    <option value="product">Product Issue</option>
                    <option value="return">Return/Refund</option>
                    <option value="technical">Technical Support</option>
                </select>
            </div>
            <div class="form-group">
                <label for="order_ref">Order Reference (optional)</label>
                <input type="text" id="order_ref" name="order_ref" placeholder="e.g. TK-AB12CD">
            </div>
        </div>
        <div class="form-group">
            <label for="message">Message *</label>
            <textarea id="message" name="message" rows="6" required placeholder="Describe your issue in detail..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Submit Ticket</button>
    </form>
</div>
{% endblock %}
